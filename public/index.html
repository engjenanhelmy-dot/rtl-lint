<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RTL Lint</title>
  <style>
    :root { --bg:#0f172a; --card:#1e293b; --text:#e2e8f0; --muted:#94a3b8;
            --pass:#22c55e; --warn:#f59e0b; --fail:#ef4444; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, sans-serif; background:var(--bg); color:var(--text); }
    main { max-width:760px; margin:0 auto; padding:48px 20px; }
    h1 { margin:0 0 8px; }
    .sub { color:var(--muted); margin:0 0 28px; }
    form { display:flex; gap:8px; }
    input { flex:1; padding:12px 14px; border-radius:8px; border:1px solid #334155;
            background:var(--card); color:var(--text); font-size:16px; }
    button { padding:12px 20px; border:0; border-radius:8px; background:#3b82f6;
             color:#fff; font-size:16px; cursor:pointer; }
    button:disabled { opacity:.6; cursor:wait; }
    #status { margin:20px 0; color:var(--muted); }
    .score { display:flex; align-items:center; gap:20px; margin:28px 0; }
    .ring { width:110px; height:110px; border-radius:50%; display:grid; place-items:center; }
    .ring span { width:84px; height:84px; border-radius:50%; background:var(--bg);
                 display:grid; place-items:center; font-size:28px; font-weight:700; }
    .card { background:var(--card); border-radius:10px; padding:14px 16px;
            margin-bottom:10px; border-inline-start:4px solid; }
    .card.pass { border-color:var(--pass); }
    .card.warn { border-color:var(--warn); }
    .card.fail { border-color:var(--fail); }
    .tag { font-weight:700; margin-inline-end:8px; }
    .pass .tag { color:var(--pass); } .warn .tag { color:var(--warn); } .fail .tag { color:var(--fail); }
    .msg { color:var(--muted); font-size:14px; margin-top:4px; }
    ul { margin:8px 0 0; padding-inline-start:20px; color:var(--muted); font-size:14px; }
  </style>
</head>
<body>
  <main>
    <h1>RTL Lint</h1>
    <p class="sub">Check how well a website supports Arabic and right-to-left layouts.</p>

    <form id="form">
      <input id="url" type="url" placeholder="https://ar.wikipedia.org" required>
      <button id="btn" type="submit">Analyze</button>
    </form>

    <div id="status"></div>
    <div id="report"></div>
  </main>

  <script>
    const form = document.getElementById("form");
    const input = document.getElementById("url");
    const btn = document.getElementById("btn");
    const statusEl = document.getElementById("status");
    const report = document.getElementById("report");

    function el(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined) node.textContent = text;
      return node;
    }

    function scoreColor(s) {
      return s >= 80 ? "var(--pass)" : s >= 50 ? "var(--warn)" : "var(--fail)";
    }

    function render(data) {
      report.replaceChildren();

      const wrap = el("div", "score");
      const ring = el("div", "ring");
      ring.style.background =
        `conic-gradient(${scoreColor(data.score)} ${data.score}%, #334155 0)`;
      ring.append(el("span", "", data.score));
      const info = el("div");
      info.append(el("strong", "", "Score out of 100"), el("div", "msg", data.url));
      wrap.append(ring, info);
      report.append(wrap);

      for (const r of data.results) {
        const state = r.issues.length === 0 ? "pass" : r.severity === "error" ? "fail" : "warn";
        const label = { pass: "PASS", warn: "WARN", fail: "FAIL" }[state];
        const card = el("div", "card " + state);
        const title = el("div");
        title.append(el("span", "tag", label), el("strong", "", r.id));
        card.append(title, el("div", "msg", r.message));
        if (r.issues.length) {
          const ul = el("ul");
          for (const issue of r.issues) ul.append(el("li", "", issue));
          card.append(ul);
        }
        report.append(card);
      }
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      btn.disabled = true;
      report.replaceChildren();
      statusEl.textContent = "Analyzing... this can take 10-20 seconds.";
      try {
        const res = await fetch("/api/analyze?url=" + encodeURIComponent(input.value));
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Something went wrong");
        statusEl.textContent = "";
        render(data);
      } catch (err) {
        statusEl.textContent = err.message;
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
